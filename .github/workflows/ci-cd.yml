name: CI/CD to Minikube

on:
  push:
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  APP_NAME: devops-k8s-demo
  REGISTRY: ${{ vars.CONTAINER_REGISTRY || 'ghcr.io' }}
  IMAGE_REPOSITORY: ${{ vars.IMAGE_REPOSITORY || github.repository }}

jobs:
  detect-environment:
    name: Detect environment
    runs-on: ubuntu-latest
    outputs:
      environment: ${{ steps.detect.outputs.environment }}
      namespace: ${{ steps.detect.outputs.namespace }}
      ingress_host: ${{ steps.detect.outputs.ingress_host }}
      short_sha: ${{ steps.detect.outputs.short_sha }}
      branch_slug: ${{ steps.detect.outputs.branch_slug }}
      deployment_name: ${{ steps.detect.outputs.deployment_name }}
      service_name: ${{ steps.detect.outputs.service_name }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Detect branch environment
        id: detect
        uses: ./.github/actions/detect-environment
        with:
          ref-name: ${{ github.ref_name }}

  app-checks:
    name: Syntax, lint, and tests
    needs: detect-environment
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: app/requirements-dev.txt

      - name: Run application checks
        uses: ./.github/actions/app-checks

  build-scan-push:
    name: Build, scan, and push image
    needs:
      - detect-environment
      - app-checks
    runs-on: ubuntu-latest
    outputs:
      image: ${{ steps.image-meta.outputs.primary_tag }}
      image_uri: ${{ steps.image-meta.outputs.image_uri }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Prepare Docker image tags
        id: image-meta
        shell: bash
        run: |
          set -euo pipefail

          registry="${REGISTRY%/}"
          repository="$(echo "$IMAGE_REPOSITORY" | tr '[:upper:]' '[:lower:]')"
          image_uri="${registry}/${repository}"
          primary_tag="${image_uri}:${{ needs.detect-environment.outputs.environment }}-${{ needs.detect-environment.outputs.short_sha }}"

          {
            echo "tags<<EOF"
            echo "$primary_tag"
            if [ "${GITHUB_REF_NAME}" = "main" ]; then
              echo "${image_uri}:latest"
            fi
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

          echo "image_uri=$image_uri" >> "$GITHUB_OUTPUT"
          echo "primary_tag=$primary_tag" >> "$GITHUB_OUTPUT"
          echo "Primary image tag: $primary_tag"

      - name: Build Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          load: true
          tags: ${{ steps.image-meta.outputs.tags }}
          labels: |
            org.opencontainers.image.title=${{ env.APP_NAME }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}

      - name: Run Trivy vulnerability report
        uses: aquasecurity/trivy-action@0.28.0
        with:
          image-ref: ${{ steps.image-meta.outputs.primary_tag }}
          format: table
          exit-code: "0"
          ignore-unfixed: true
          vuln-type: os,library
          severity: UNKNOWN,LOW,MEDIUM,HIGH,CRITICAL

      - name: Enforce Trivy HIGH and CRITICAL gate
        uses: aquasecurity/trivy-action@0.28.0
        with:
          image-ref: ${{ steps.image-meta.outputs.primary_tag }}
          format: table
          exit-code: "1"
          ignore-unfixed: true
          vuln-type: os,library
          severity: HIGH,CRITICAL

      - name: Log in to GitHub Container Registry
        if: env.REGISTRY == 'ghcr.io'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Log in to custom container registry
        if: env.REGISTRY != 'ghcr.io'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ secrets.REGISTRY_USERNAME }}
          password: ${{ secrets.REGISTRY_PASSWORD }}

      - name: Push Docker image
        shell: bash
        env:
          TAGS: ${{ steps.image-meta.outputs.tags }}
        run: |
          set -euo pipefail
          while IFS= read -r tag; do
            if [ -n "$tag" ]; then
              docker push "$tag"
            fi
          done <<< "$TAGS"

  deploy-minikube:
    name: Deploy to Minikube when available
    needs:
      - detect-environment
      - build-scan-push
    runs-on: ${{ vars.MINIKUBE_RUNNER || 'ubuntu-latest' }}
    env:
      ENVIRONMENT: ${{ needs.detect-environment.outputs.environment }}
      NAMESPACE: ${{ needs.detect-environment.outputs.namespace }}
      DEPLOYMENT_NAME: ${{ needs.detect-environment.outputs.deployment_name }}
      SERVICE_NAME: ${{ needs.detect-environment.outputs.service_name }}
      INGRESS_HOST: ${{ needs.detect-environment.outputs.ingress_host }}
      IMAGE: ${{ needs.build-scan-push.outputs.image }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure kubeconfig from secret when provided
        shell: bash
        env:
          KUBE_CONFIG_DATA: ${{ secrets.KUBE_CONFIG }}
        run: |
          set -euo pipefail
          if [ -z "$KUBE_CONFIG_DATA" ]; then
            echo "No KUBE_CONFIG secret provided. The runner's default kubeconfig will be used if available."
            exit 0
          fi

          mkdir -p "$HOME/.kube"
          if echo "$KUBE_CONFIG_DATA" | base64 --decode > "$HOME/.kube/config" 2>/dev/null; then
            echo "Configured kubeconfig from base64 encoded KUBE_CONFIG secret."
          else
            printf '%s' "$KUBE_CONFIG_DATA" > "$HOME/.kube/config"
            echo "Configured kubeconfig from plain text KUBE_CONFIG secret."
          fi
          chmod 600 "$HOME/.kube/config"

      - name: Check Kubernetes access
        id: cluster
        shell: bash
        run: |
          set -euo pipefail
          if ! command -v kubectl >/dev/null 2>&1; then
            echo "::notice::kubectl is not installed. Direct Minikube deployment is skipped."
            echo "available=false" >> "$GITHUB_OUTPUT"
            echo "status=Skipped - kubectl is not installed" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if ! kubectl cluster-info --request-timeout=5s >/tmp/kubernetes-cluster-info.txt 2>&1; then
            echo "::notice::No reachable Kubernetes cluster is configured. Direct Minikube deployment is skipped."
            cat /tmp/kubernetes-cluster-info.txt
            echo "available=false" >> "$GITHUB_OUTPUT"
            echo "status=Skipped - no reachable Kubernetes cluster" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          kubectl version --client=true
          kubectl get nodes -o wide
          echo "available=true" >> "$GITHUB_OUTPUT"
          echo "status=Cluster available" >> "$GITHUB_OUTPUT"

      - name: Deploy selected Kustomize overlay
        id: deploy
        if: steps.cluster.outputs.available == 'true'
        shell: bash
        run: |
          set -euo pipefail
          kubectl apply -k "k8s/overlays/${ENVIRONMENT}"
          kubectl set image "deployment/${DEPLOYMENT_NAME}" "web=${IMAGE}" -n "${NAMESPACE}"

      - name: Verify Kubernetes deployment
        id: verify
        if: steps.cluster.outputs.available == 'true'
        uses: ./.github/actions/verify-deployment
        with:
          namespace: ${{ env.NAMESPACE }}
          deployment-name: ${{ env.DEPLOYMENT_NAME }}
          service-name: ${{ env.SERVICE_NAME }}

      - name: Write deployment summary
        if: always()
        uses: ./.github/actions/deploy-summary
        with:
          app-name: ${{ env.APP_NAME }}
          environment: ${{ env.ENVIRONMENT }}
          branch: ${{ github.ref_name }}
          commit-sha: ${{ github.sha }}
          image: ${{ env.IMAGE }}
          namespace: ${{ env.NAMESPACE }}
          deployment-name: ${{ env.DEPLOYMENT_NAME }}
          service-name: ${{ env.SERVICE_NAME }}
          ingress-host: ${{ env.INGRESS_HOST }}
          status: ${{ steps.cluster.outputs.available != 'true' && steps.cluster.outputs.status || (steps.deploy.outcome == 'success' && steps.verify.outcome == 'success' && 'Successful' || 'Failed') }}
