name: CI/CD to Minikube

on:
  push:
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  APP_NAME: devops-k8s-demo
  REGISTRY: ${{ vars.CONTAINER_REGISTRY || 'ghcr.io' }}
  IMAGE_REPOSITORY: ${{ vars.IMAGE_REPOSITORY || github.repository }}

jobs:
  detect-environment:
    name: Detect environment
    runs-on: ubuntu-latest
    outputs:
      environment: ${{ steps.detect.outputs.environment }}
      namespace: ${{ steps.detect.outputs.namespace }}
      ingress_host: ${{ steps.detect.outputs.ingress_host }}
      short_sha: ${{ steps.detect.outputs.short_sha }}
      branch_slug: ${{ steps.detect.outputs.branch_slug }}
      deployment_name: ${{ steps.detect.outputs.deployment_name }}
      service_name: ${{ steps.detect.outputs.service_name }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Detect branch environment
        id: detect
        uses: ./.github/actions/detect-environment
        with:
          ref-name: ${{ github.ref_name }}

  app-checks:
    name: Syntax, lint, and tests
    needs: detect-environment
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: app/requirements-dev.txt

      - name: Run application checks
        uses: ./.github/actions/app-checks

  build-image:
    name: Build Docker image
    needs:
      - detect-environment
      - app-checks
    runs-on: ubuntu-latest
    outputs:
      image: ${{ steps.image-meta.outputs.primary_tag }}
      image_uri: ${{ steps.image-meta.outputs.image_uri }}
      tags: ${{ steps.image-meta.outputs.tags }}
      artifact_name: ${{ steps.image-meta.outputs.artifact_name }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Prepare Docker image tags
        id: image-meta
        uses: ./.github/actions/docker-image-metadata
        with:
          app-name: ${{ env.APP_NAME }}
          registry: ${{ env.REGISTRY }}
          image-repository: ${{ env.IMAGE_REPOSITORY }}
          environment: ${{ needs.detect-environment.outputs.environment }}
          short-sha: ${{ needs.detect-environment.outputs.short_sha }}
          ref-name: ${{ github.ref_name }}

      - name: Build Docker image
        uses: ./.github/actions/docker-build
        with:
          tags: ${{ steps.image-meta.outputs.tags }}
          app-name: ${{ env.APP_NAME }}
          source-url: ${{ github.server_url }}/${{ github.repository }}
          revision: ${{ github.sha }}

      - name: Export Docker image artifact
        uses: ./.github/actions/export-docker-image
        with:
          tags: ${{ steps.image-meta.outputs.tags }}
          artifact-name: ${{ steps.image-meta.outputs.artifact_name }}

      - name: Upload Docker image artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.image-meta.outputs.artifact_name }}
          path: /tmp/docker-image/${{ steps.image-meta.outputs.artifact_name }}
          if-no-files-found: error
          retention-days: 1

  scan-image:
    name: Scan Docker image
    needs:
      - detect-environment
      - build-image
    runs-on: ubuntu-latest
    steps:
      - name: Download Docker image artifact
        uses: actions/download-artifact@v4
        with:
          name: ${{ needs.build-image.outputs.artifact_name }}
          path: /tmp/docker-image

      - name: Load Docker image
        uses: ./.github/actions/load-docker-image
        with:
          artifact-name: ${{ needs.build-image.outputs.artifact_name }}

      - name: Run Trivy vulnerability report
        uses: aquasecurity/trivy-action@0.28.0
        with:
          image-ref: ${{ needs.build-image.outputs.image }}
          format: table
          exit-code: "0"
          ignore-unfixed: true
          vuln-type: os,library
          severity: UNKNOWN,LOW,MEDIUM,HIGH,CRITICAL

      - name: Enforce Trivy HIGH and CRITICAL gate
        uses: aquasecurity/trivy-action@0.28.0
        with:
          image-ref: ${{ needs.build-image.outputs.image }}
          format: table
          exit-code: "1"
          ignore-unfixed: true
          vuln-type: os,library
          severity: HIGH,CRITICAL

  push-image:
    name: Push Docker image
    needs:
      - build-image
      - scan-image
    runs-on: ubuntu-latest
    outputs:
      image: ${{ needs.build-image.outputs.image }}
      image_uri: ${{ needs.build-image.outputs.image_uri }}
    steps:
      - name: Download Docker image artifact
        uses: actions/download-artifact@v4
        with:
          name: ${{ needs.build-image.outputs.artifact_name }}
          path: /tmp/docker-image

      - name: Load Docker image
        uses: ./.github/actions/load-docker-image
        with:
          artifact-name: ${{ needs.build-image.outputs.artifact_name }}

      - name: Log in to GitHub Container Registry
        if: env.REGISTRY == 'ghcr.io'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Log in to custom container registry
        if: env.REGISTRY != 'ghcr.io'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ secrets.REGISTRY_USERNAME }}
          password: ${{ secrets.REGISTRY_PASSWORD }}

      - name: Push Docker image
        uses: ./.github/actions/push-docker-image
        with:
          tags: ${{ needs.build-image.outputs.tags }}

  deploy-minikube:
    name: Deploy to Minikube when available
    needs:
      - detect-environment
      - build-image
      - push-image
    runs-on: ${{ vars.MINIKUBE_RUNNER || 'ubuntu-latest' }}
    env:
      ENVIRONMENT: ${{ needs.detect-environment.outputs.environment }}
      NAMESPACE: ${{ needs.detect-environment.outputs.namespace }}
      DEPLOYMENT_NAME: ${{ needs.detect-environment.outputs.deployment_name }}
      SERVICE_NAME: ${{ needs.detect-environment.outputs.service_name }}
      INGRESS_HOST: ${{ needs.detect-environment.outputs.ingress_host }}
      IMAGE: ${{ needs.build-image.outputs.image }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure kubeconfig from secret when provided
        uses: ./.github/actions/configure-kubeconfig
        with:
          kube-config-data: ${{ secrets.KUBE_CONFIG }}

      - name: Check Kubernetes access
        id: cluster
        uses: ./.github/actions/check-kubernetes-access

      - name: Deploy selected Kustomize overlay
        id: deploy
        if: steps.cluster.outputs.available == 'true'
        uses: ./.github/actions/deploy-kustomize
        with:
          environment: ${{ env.ENVIRONMENT }}
          namespace: ${{ env.NAMESPACE }}
          deployment-name: ${{ env.DEPLOYMENT_NAME }}
          image: ${{ env.IMAGE }}

      - name: Verify Kubernetes deployment
        id: verify
        if: steps.cluster.outputs.available == 'true'
        uses: ./.github/actions/verify-deployment
        with:
          namespace: ${{ env.NAMESPACE }}
          deployment-name: ${{ env.DEPLOYMENT_NAME }}
          service-name: ${{ env.SERVICE_NAME }}

      - name: Write deployment summary
        if: always()
        uses: ./.github/actions/deploy-summary
        with:
          app-name: ${{ env.APP_NAME }}
          environment: ${{ env.ENVIRONMENT }}
          branch: ${{ github.ref_name }}
          commit-sha: ${{ github.sha }}
          image: ${{ env.IMAGE }}
          namespace: ${{ env.NAMESPACE }}
          deployment-name: ${{ env.DEPLOYMENT_NAME }}
          service-name: ${{ env.SERVICE_NAME }}
          ingress-host: ${{ env.INGRESS_HOST }}
          status: ${{ steps.cluster.outputs.available != 'true' && steps.cluster.outputs.status || (steps.deploy.outcome == 'success' && steps.verify.outcome == 'success' && 'Successful' || 'Failed') }}
