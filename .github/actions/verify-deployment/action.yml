name: Verify deployment
description: Verify Kubernetes rollout and print useful cluster resources.

inputs:
  namespace:
    description: Kubernetes namespace.
    required: true
  deployment-name:
    description: Kubernetes Deployment name.
    required: true
  service-name:
    description: Kubernetes Service name.
    required: true

outputs:
  status:
    description: Verification status.
    value: ${{ steps.verify.outputs.status }}

runs:
  using: composite
  steps:
    - name: Verify Kubernetes resources
      id: verify
      shell: bash
      run: |
        set -euo pipefail

        kubectl rollout status deployment/${{ inputs.deployment-name }} \
          -n ${{ inputs.namespace }} \
          --timeout=180s

        kubectl get pods -n ${{ inputs.namespace }} -o wide
        kubectl get svc ${{ inputs.service-name }} -n ${{ inputs.namespace }} -o wide
        kubectl get ingress -n ${{ inputs.namespace }} -o wide

        echo "status=Successful" >> "$GITHUB_OUTPUT"
