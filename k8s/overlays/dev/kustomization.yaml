apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: devops-demo-dev

resources:
  - ../../base
  - namespace.yaml

patches:
  - path: configmap-patch.yaml
  - path: deployment-patch.yaml
  - path: hpa-patch.yaml
  - path: ingress-patch.yaml

labels:
  - pairs:
      app.kubernetes.io/environment: dev
