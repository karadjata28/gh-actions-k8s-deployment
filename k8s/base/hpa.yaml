apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: devops-k8s-demo
  labels:
    app.kubernetes.io/name: devops-k8s-demo
    app.kubernetes.io/component: autoscaling
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: devops-k8s-demo
  minReplicas: 2
  maxReplicas: 4
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
